name: Research lagged PUE shadow SLA risk gate pilot

on:
  push:
    branches: [research-baselines]
    paths:
      - ".github/workflows/research-lagged-pue-shadow-guard.yml"
      - "research/lagged_pue_risk_policy.py"
      - "research/tests/test_lagged_pue_shadow_guard.py"
      - "research/unified_baseline_smoke.py"
      - "research/route_spillover_audit.py"
      - "research/tests/test_route_spillover_audit.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-risk-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - {name: jan20_05, month: 1, day: 20, scale: "0.05"}
          - {name: apr15_05, month: 4, day: 15, scale: "0.05"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install simulator dependencies
        run: python -m pip install -r requirements.txt
      - name: Unpack Alibaba trace
        run: unzip -n data/workload/alibaba_2020_dataset/result_df_full_year_2020.zip -d data/workload/alibaba_2020_dataset/
      - name: Unit contracts (no future decision results)
        run: |
          set -o pipefail
          mkdir -p research/results
          python -m unittest discover -s research/tests -p 'test_lagged_pue_shadow_guard.py' -v 2>&1 | tee research/results/shadow_guard_unit.log
          python -m unittest discover -s research/tests -p 'test_route_spillover_audit.py' -v 2>&1 | tee research/results/route_spillover_unit.log
      - name: Matched development simulation
        run: |
          set -o pipefail
          python -m research.batch_unified_baselines \
            --steps 16 --drain-steps 112 \
            --start-month ${{ matrix.scenario.month }} --start-day ${{ matrix.scenario.day }} \
            --cpu-capacity-scale ${{ matrix.scenario.scale }} \
            --seeds 901 1701 \
            --policies queue_nsga2_indexed_transit queue_nsga2_lagged_pue queue_nsga2_lagged_pue_shadow_guard \
            --output-prefix research/results/shadow_guard_${{ matrix.scenario.name }} \
            2>&1 | tee research/results/shadow_guard_${{ matrix.scenario.name }}.log
      - name: Audit task identities, actual SLA, physical carbon and extra computation
        run: |
          set -o pipefail
          python - <<'PY'
          import json,csv
          from pathlib import Path
          from research.planner_overhead_audit import audit_planner_rows
          from research.paired_task_analysis import compare_task_rows
          stem="research/results/shadow_guard_${{ matrix.scenario.name }}"
          runs=json.loads(Path(stem+".json").read_text())
          with open(stem+"_completed_tasks.csv",newline="") as f:
              tasks=list(csv.DictReader(f))
          report=[]
          for seed in (901,1701):
              cohort=[r for r in runs if int(r["seed"])==seed]
              assert len(cohort)==3
              audit_planner_rows(cohort)
              by={r["policy"]:r for r in cohort}
              base=by["queue_nsga2_indexed_transit"]
              proposal=by["queue_nsga2_lagged_pue"]
              guarded=by["queue_nsga2_lagged_pue_shadow_guard"]
              audit=compare_task_rows(
                  [t for t in tasks if int(t["seed"])==seed],
                  reference="queue_nsga2_indexed_transit"
              )
              assert {r["policy"] for r in audit}=={
                  "queue_nsga2_lagged_pue","queue_nsga2_lagged_pue_shadow_guard"
              }
              expected=int(base["nsga2_evaluation_requests"])
              assert expected>0
              assert proposal["nsga2_evaluation_requests"]==expected
              assert guarded["nsga2_evaluation_requests"]==expected
              assert guarded["shadow_evaluation_requests"]==expected
              assert guarded["total_nsga2_evaluation_requests"]==2*expected
              assert guarded["risk_guard_checks"]>0
              assert 0<=guarded["risk_guard_reversions"]<=guarded["risk_guard_checks"]
              assert guarded["lagged_pue_observation_steps"]==guarded["steps_completed"]
              record={
                  "seed":seed,
                  "base_sla":int(base["sla_violated"]),
                  "proposal_sla":int(proposal["sla_violated"]),
                  "guarded_sla":int(guarded["sla_violated"]),
                  "guarded_minus_base_carbon_kg":guarded["reported_total_carbon_kg"]-base["reported_total_carbon_kg"],
                  "guarded_minus_proposal_carbon_kg":guarded["reported_total_carbon_kg"]-proposal["reported_total_carbon_kg"],
                  "guarded_minus_proposal_sla":guarded["sla_violated"]-proposal["sla_violated"],
                  "risk_reversions":int(guarded["risk_guard_reversions"]),
                  "risk_late_predictions":int(guarded["risk_guard_late_tasks"]),
                  "extra_shadow_evaluation_requests":expected,
                  "guarded_planner_p95_ms":guarded["planner_dispatch_p95_ms"],
                  "base_planner_p95_ms":base["planner_dispatch_p95_ms"],
                  "proposal_planner_p95_ms":proposal["planner_dispatch_p95_ms"]
              }
              report.append(record)
              print(json.dumps(record,sort_keys=True))
          Path(stem+"_audit.json").write_text(json.dumps(report,indent=2,allow_nan=False)+"\n")
          PY
      - name: Diagnose unchanged-destination SLA spillovers
        run: |
          set -o pipefail
          python -m research.route_spillover_audit \
            --tasks research/results/shadow_guard_${{ matrix.scenario.name }}_completed_tasks.csv \
            --reference queue_nsga2_indexed_transit \
            --candidates queue_nsga2_lagged_pue queue_nsga2_lagged_pue_shadow_guard \
            --output research/results/shadow_guard_${{ matrix.scenario.name }}_spillover.json \
            2>&1 | tee research/results/shadow_guard_${{ matrix.scenario.name }}_spillover.log
      - name: Keep all raw scenarios (including regressions and failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lagged-pue-shadow-guard-${{ matrix.scenario.name }}
          path: |
            research/results/shadow_guard_*
          retention-days: 90
          if-no-files-found: warn
