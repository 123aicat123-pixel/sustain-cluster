name: Research full-simulator smoke

on:
  push:
    branches: [research-baselines]
    paths:
      - "research/smoke_original_baselines.py"
      - ".github/workflows/research-smoke.yml"
      - "train_SAC_agent.py"
      - "envs/**"
      - "simulation/**"
      - "rewards/**"
      - "configs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-rule-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install upstream dependencies
        run: python -m pip install -r requirements.txt
      - name: Extract bundled workload
        run: |
          unzip -n data/workload/alibaba_2020_dataset/result_df_full_year_2020.zip -d data/workload/alibaba_2020_dataset/
      - name: Run short original-strategy simulation smoke
        run: |
          mkdir -p research/results
          set -o pipefail
          python -m research.smoke_original_baselines --seed 42 --steps 8 2>&1 | tee research/results/full-simulator-smoke.log
      - name: Archive smoke results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sustaincluster-full-simulator-smoke
          path: research/results/
          if-no-files-found: warn
