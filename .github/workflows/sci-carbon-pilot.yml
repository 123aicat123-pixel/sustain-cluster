name: SCI carbon pilot

on:
  push:
    branches:
      - research/sci-carbon-pilot
  workflow_dispatch:

permissions:
  contents: read

# Re-running a full seven-job suite for every research commit wastes
# simulator CPU and can queue multiple stale versions. Keep only the
# newest branch-head evaluation active at any moment.
concurrency:
  group: sci-carbon-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run independent strategy tests
        run: |
          python -m unittest discover -s research_sci -p 'test_*.py' -v
      - name: Syntax validation
        run: |
          python -m compileall -q research_sci/

  simulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install simulator dependencies
        run: python -m pip install -r requirements.txt
      - name: Extract bundled Alibaba workload
        run: |
          unzip -n data/workload/alibaba_2020_dataset/result_df_full_year_2020.zip -d data/workload/alibaba_2020_dataset/
      - name: Run matched-action full-simulator pilot
        run: |
          python -m research_sci.run_pilot --steps 8 --drain-steps 24 --seeds 42 --policies round_robin lowest_carbon fastest_finish sla_carbon slack_wait_once causal_carbon_wait queue_risk_carbon queue_risk_defer queue_calibrated_carbon queue_calibrated_defer
      - name: Run paired multi-seed exploratory experiment
        run: |
          python -m research_sci.run_pilot --steps 32 --drain-steps 96 --seeds 1 42 2026 --policies round_robin lowest_carbon fastest_finish sla_carbon slack_wait_once causal_carbon_wait queue_risk_carbon queue_risk_defer queue_calibrated_carbon queue_calibrated_defer --output research_sci/results/pilot_3seeds.json
          python -m research_sci.summarize research_sci/results/pilot_3seeds.json
      - name: Capacity stress pilot (independent matched action set)
        run: |
          python -m research_sci.run_pilot --steps 16 --drain-steps 64 --seeds 1 42 --audit-predictions --capacity-scale 0.02 --policies lowest_carbon sla_carbon queue_risk_carbon queue_risk_defer queue_calibrated_carbon queue_calibrated_defer --output research_sci/results/stress_002.json
          python -m research_sci.summarize research_sci/results/stress_002.json --reference lowest_carbon
      - name: Longer admission window calibration activity check
        run: |
          python -m research_sci.run_pilot --steps 32 --drain-steps 96 --seeds 1 42 --audit-predictions --capacity-scale 0.02 --policies queue_risk_carbon queue_calibrated_carbon queue_risk_defer queue_calibrated_defer --output research_sci/results/stress_long_calibration.json
          python -m research_sci.summarize research_sci/results/stress_long_calibration.json --reference queue_risk_carbon
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sci-carbon-pilot-results
          path: research_sci/results/
          if-no-files-found: warn

  chronological-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install simulator dependencies
        run: python -m pip install -r requirements.txt
      - name: Extract bundled Alibaba workload
        run: |
          unzip -n data/workload/alibaba_2020_dataset/result_df_full_year_2020.zip -d data/workload/alibaba_2020_dataset/
      - name: Run leakage-audited chronological holdout
        run: |
          python -m research_sci.chronological_eval --seeds 1 42 --calibration-steps 16 --gap-steps 128 --test-steps 16 --drain-steps 96 --capacity-scale 0.02 --output research_sci/results/chronological.json
      - name: Upload chronological holdout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sci-carbon-chronological-holdout
          path: research_sci/results/chronological.*
          if-no-files-found: warn

  risk-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install simulator dependencies
        run: python -m pip install -r requirements.txt
      - name: Extract bundled Alibaba workload
        run: |
          unzip -n data/workload/alibaba_2020_dataset/result_df_full_year_2020.zip -d data/workload/alibaba_2020_dataset/
      - name: Run predeclared paired carbon SLA frontier
        run: |
          python -m research_sci.risk_frontier --seeds 1 42 --calibration-steps 16 --gap-steps 128 --test-steps 16 --drain-steps 96 --capacity-scale 0.02 --output research_sci/results/risk_frontier.json
      - name: Upload frontier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sci-carbon-risk-frontier
          path: research_sci/results/risk_frontier.*
          if-no-files-found: warn

  nested-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install simulator dependencies
        run: python -m pip install -r requirements.txt
      - name: Extract bundled Alibaba workload
        run: |
          unzip -n data/workload/alibaba_2020_dataset/result_df_full_year_2020.zip -d data/workload/alibaba_2020_dataset/
      - name: Validation selection then locked later test
        run: |
          python -m research_sci.nested_validation --seeds 1 42 --capacity-scale 0.02 --output research_sci/results/nested_validation.json
      - name: Upload nested evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sci-carbon-nested-validation
          path: research_sci/results/nested_validation.*
          if-no-files-found: warn

  temporal-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install simulator dependencies
        run: python -m pip install -r requirements.txt
      - name: Extract bundled Alibaba workload
        run: |
          unzip -n data/workload/alibaba_2020_dataset/result_df_full_year_2020.zip -d data/workload/alibaba_2020_dataset/
      - name: Validate once then test two later disjoint time intervals
        run: |
          python -m research_sci.temporal_robustness --seeds 1 42 --test-start-ticks 288 448 --capacity-scale 0.02 --output research_sci/results/temporal_robustness.json
      - name: Upload per-window generalization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sci-carbon-temporal-robustness
          path: research_sci/results/temporal_robustness*
          if-no-files-found: warn

  capacity-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install simulator dependencies
        run: python -m pip install -r requirements.txt
      - name: Extract bundled Alibaba workload
        run: |
          unzip -n data/workload/alibaba_2020_dataset/result_df_full_year_2020.zip -d data/workload/alibaba_2020_dataset/
      - name: Lock selection once and sweep capacity plus later time windows
        run: |
          python -m research_sci.capacity_sensitivity --seeds 1 42 --capacity-scales 0.02 0.05 0.1 --test-start-ticks 288 448 --output research_sci/results/capacity_sensitivity.json
      - name: Archive sensitivity results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sci-carbon-capacity-sensitivity
          path: research_sci/results/capacity_sensitivity.*
          if-no-files-found: warn

  state-risk-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install simulator dependencies
        run: python -m pip install -r requirements.txt
      - name: Extract bundled Alibaba workload
        run: |
          unzip -n data/workload/alibaba_2020_dataset/result_df_full_year_2020.zip -d data/workload/alibaba_2020_dataset/
      - name: Observe decision-time resource pressure and later forecast errors
        run: |
          python -m research_sci.state_risk_study --seeds 1 42 --capacity-scales 0.02 0.1 --test-start-ticks 288 448 --output research_sci/results/state_risk_study.json
      - name: Archive per-task predecision states and error summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sci-carbon-state-risk-observation
          path: research_sci/results/state_risk_study*
          if-no-files-found: warn

  action-feasibility-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install simulator dependencies
        run: python -m pip install -r requirements.txt
      - name: Extract bundled Alibaba workload
        run: |
          unzip -n data/workload/alibaba_2020_dataset/result_df_full_year_2020.zip -d data/workload/alibaba_2020_dataset/
      - name: Compare all candidate DCs at decision time across heldout pressure
        run: |
          python -m research_sci.action_feasibility_study --seeds 1 42 --capacity-scales 0.02 0.1 --test-start-ticks 288 448 --output research_sci/results/action_feasibility_study.json
      - name: Archive candidate feasibility audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sci-carbon-action-feasibility
          path: research_sci/results/action_feasibility_study*
          if-no-files-found: warn

  queue-priority-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install simulator dependencies
        run: python -m pip install -r requirements.txt
      - name: Extract bundled Alibaba workload
        run: |
          unzip -n data/workload/alibaba_2020_dataset/result_df_full_year_2020.zip -d data/workload/alibaba_2020_dataset/
      - name: Compare original FIFO versus opt-in EDF with matching queue forecast
        run: |
          python -m research_sci.queue_priority_experiment --seeds 1 42 --capacity-scales 0.02 0.1 --test-start-ticks 288 448 --output research_sci/results/queue_priority.json
      - name: Upload queue discipline ablation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sci-carbon-queue-priority
          path: research_sci/results/queue_priority*
          if-no-files-found: warn
