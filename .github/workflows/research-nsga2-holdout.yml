name: Research NSGA-II fresh-seed validation

on:
  push:
    branches: [research-baselines]
    paths:
      - ".github/workflows/research-nsga2-holdout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nsga2-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install simulator dependencies
        run: python -m pip install -r requirements.txt
      - name: Extract Alibaba workload
        run: unzip -n data/workload/alibaba_2020_dataset/result_df_full_year_2020.zip -d data/workload/alibaba_2020_dataset/
      - name: Run fixed-parameter held-out seeded experiments
        run: |
          mkdir -p research/results
          set -o pipefail
          python -m research.batch_unified_baselines \
            --steps 64 --drain-steps 128 \
            --seeds 27182 12345 8080 \
            --policies lowest_carbon sla_feasible_carbon nsga2_surrogate \
            --output-prefix research/results/nsga2_holdout \
            2>&1 | tee research/results/nsga2_holdout.log
      - name: Reconcile matched task cohorts and SLA statuses
        run: |
          set -o pipefail
          python -m research.paired_task_analysis \
            --input research/results/nsga2_holdout_completed_tasks.csv \
            --output research/results/nsga2_holdout_paired.json \
            2>&1 | tee research/results/nsga2_holdout_paired.log
      - name: Fail on censored or mismatched cohorts
        run: |
          python - <<'PY'
          import json
          rows=json.load(open('research/results/nsga2_holdout.json'))
          assert len(rows)==9
          for seed in (27182,12345,8080):
              subset=[r for r in rows if r['seed']==seed]
              assert len(subset)==3
              assert len({r['tasks_dispatched'] for r in subset})==1
              assert all(r['fully_drained'] for r in subset),f'incomplete seed={seed}'
              assert all(r['fallback_assignments']==0 for r in subset),f'fallback seed={seed}'
              assert all(r['lifecycle_conserved'] and r['tasks_finished']==r['task_audit_completed'] for r in subset)
          for r in rows:
              if r['policy']=='nsga2_surrogate':
                  assert r['nsga2_surrogate_evaluations']>0
                  assert r['nsga2_evaluation_requests']>=r['nsga2_surrogate_evaluations']
          print('Matched, fully drained holdout seed runs validated (descriptive evidence only).')
          PY
      - name: Archive complete raw observations and evaluation budgets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nsga2-holdout-raw-task-evidence
          path: research/results/nsga2_holdout*
          retention-days: 90
          if-no-files-found: warn
