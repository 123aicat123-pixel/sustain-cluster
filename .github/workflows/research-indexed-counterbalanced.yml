name: Research indexed queue counterbalanced order validation

on:
  push:
    branches: [research-baselines]
    paths:
      - ".github/workflows/research-indexed-counterbalanced.yml"
      - "research/indexed_order_audit.py"
      - "research/tests/test_indexed_order_audit.py"
      - "research/indexed_counterbalanced_summary.py"
      - "research/tests/test_indexed_counterbalanced_summary.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  counterbalanced:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - {name: may19_05, month: 5, day: 19, scale: "0.05"}
          - {name: nov12_10, month: 11, day: 12, scale: "0.10"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install simulation environment
        run: python -m pip install -r requirements.txt
      - name: Unzip Alibaba trace
        run: unzip -n data/workload/alibaba_2020_dataset/result_df_full_year_2020.zip -d data/workload/alibaba_2020_dataset/
      - name: Test counterbalanced audit contracts
        run: |
          set -o pipefail
          mkdir -p research/results
          python -m unittest discover -s research/tests -p 'test_indexed_order_audit.py' -v 2>&1 | tee research/results/counterbalanced_unit.log
          python -m unittest discover -s research/tests -p 'test_indexed_counterbalanced_summary.py' -v 2>&1 | tee research/results/counterbalanced_summary_unit.log
      - name: Forward order Legacy then Indexed
        run: |
          set -o pipefail
          python -m research.batch_unified_baselines \
            --steps 16 --drain-steps 112 \
            --start-month ${{ matrix.scenario.month }} --start-day ${{ matrix.scenario.day }} \
            --cpu-capacity-scale ${{ matrix.scenario.scale }} --seeds 901 1701 \
            --policies queue_nsga2_with_transit queue_nsga2_indexed_transit \
            --output-prefix research/results/counterbalanced_${{ matrix.scenario.name }}_forward \
            2>&1 | tee research/results/counterbalanced_${{ matrix.scenario.name }}_forward.log
      - name: Reverse order Indexed then Legacy
        run: |
          set -o pipefail
          python -m research.batch_unified_baselines \
            --steps 16 --drain-steps 112 \
            --start-month ${{ matrix.scenario.month }} --start-day ${{ matrix.scenario.day }} \
            --cpu-capacity-scale ${{ matrix.scenario.scale }} --seeds 901 1701 \
            --policies queue_nsga2_indexed_transit queue_nsga2_with_transit \
            --output-prefix research/results/counterbalanced_${{ matrix.scenario.name }}_reverse \
            2>&1 | tee research/results/counterbalanced_${{ matrix.scenario.name }}_reverse.log
      - name: Match exact tasks and evaluate signed timings
        run: |
          set -o pipefail
          python -m research.indexed_order_audit \
            --prefix research/results/counterbalanced_${{ matrix.scenario.name }} \
            --output research/results/counterbalanced_${{ matrix.scenario.name }}_audit.json \
            2>&1 | tee research/results/counterbalanced_${{ matrix.scenario.name }}_audit.log
      - name: Preserve both execution orders and signed deltas in a scenario summary
        run: |
          set -o pipefail
          python -m research.indexed_counterbalanced_summary \
            --inputs research/results/counterbalanced_${{ matrix.scenario.name }}_audit.json \
            --output research/results/counterbalanced_${{ matrix.scenario.name }}_summary.json \
            2>&1 | tee research/results/counterbalanced_${{ matrix.scenario.name }}_summary.log
      - name: Archive raw results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexed-counterbalanced-${{ matrix.scenario.name }}
          path: research/results/counterbalanced_*
          retention-days: 90
          if-no-files-found: warn
