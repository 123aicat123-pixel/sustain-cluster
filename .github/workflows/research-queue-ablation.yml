name: Research queue-aware NSGA-II ablation pilot

on:
  push:
    branches: [research-baselines]
    paths:
      - "research/queue_aware_nsga2.py"
      - "research/tests/test_queue_aware_nsga2.py"
      - "research/unified_baseline_smoke.py"
      - ".github/workflows/research-queue-ablation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue-ablations:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install upstream simulator
        run: python -m pip install -r requirements.txt
      - name: Extract Alibaba task trace
        run: unzip -n data/workload/alibaba_2020_dataset/result_df_full_year_2020.zip -d data/workload/alibaba_2020_dataset/
      - name: Validate queue model and existing NSGA-II
        run: |
          mkdir -p research/results
          set -o pipefail
          python -m unittest discover -s research/tests -p 'test_*.py' -v 2>&1 | tee research/results/queue-ablation-unit.log
      - name: Run matched 4-hour admissions and 12-hour drain
        run: |
          set -o pipefail
          python -m research.batch_unified_baselines \
            --steps 16 --drain-steps 48 --seeds 42 \
            --policies sla_feasible_carbon nsga2_surrogate queue_nsga2 queue_nsga2_no_queue queue_nsga2_no_transfer \
            --output-prefix research/results/queue_ablation_pilot \
            2>&1 | tee research/results/queue-ablation-pilot.log
      - name: Validate paired task cohorts
        run: |
          set -o pipefail
          python -m research.paired_task_analysis \
            --input research/results/queue_ablation_pilot_completed_tasks.csv \
            --reference sla_feasible_carbon \
            --output research/results/queue_ablation_pilot_paired.json \
            2>&1 | tee research/results/queue-ablation-paired.log
      - name: Check objective and budget availability
        run: |
          python - <<'PY'
          import json
          rows=json.load(open('research/results/queue_ablation_pilot.json'))
          assert len(rows)==5
          counts={x['tasks_dispatched'] for x in rows}
          assert len(counts)==1,counts
          assert all(x['lifecycle_conserved'] for x in rows)
          for x in rows:
              assert x['fully_drained'], (x['policy'],x['unfinished_dispatched'])
              assert x['fallback_assignments']==0,(x['policy'],x['fallback_assignments'])
              if x['policy']!='sla_feasible_carbon':
                  assert x['nsga2_batch_optimizations']>0
                  assert x['nsga2_surrogate_evaluations']>0
          print('Five matched policies, fully drained, pilot accounting verified')
          PY
      - name: Preserve raw task outcomes, failures, and timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queue-ablation-pilot-evidence
          path: research/results/queue*
          retention-days: 90
          if-no-files-found: warn
