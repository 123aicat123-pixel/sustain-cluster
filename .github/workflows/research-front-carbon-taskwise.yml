name: Research taskwise carbon risk dominance pilot

on:
  push:
    branches: [research-baselines]
    paths:
      - "research/transit_front_carbon.py"
      - "research/queue_aware_nsga2.py"
      - "research/nsga2_core.py"
      - "research/unified_baseline_smoke.py"
      - "research/tests/test_front_carbon_taskwise.py"
      - ".github/workflows/research-front-carbon-taskwise.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  taskwise-carbon:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - {name: jun15_05, month: 6, day: 15, scale: "0.05"}
          - {name: nov12_05, month: 11, day: 12, scale: "0.05"}
          - {name: may19_10, month: 5, day: 19, scale: "0.10"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Extract archived Alibaba workload
        run: unzip -n data/workload/alibaba_2020_dataset/result_df_full_year_2020.zip -d data/workload/alibaba_2020_dataset/
      - name: Run risk selector regressions
        run: |
          set -o pipefail
          mkdir -p research/results
          python -m unittest discover -s research/tests -p 'test_front_carbon_taskwise.py' -v 2>&1 | tee research/results/taskwise_tests.log
          python -m unittest discover -s research/tests -p 'test_front_carbon_risk.py' -v 2>&1 | tee research/results/taskwise_old_tests.log
      - name: Run fixed-budget policy comparisons on previously explored dates
        run: |
          set -o pipefail
          python -m research.batch_unified_baselines \
            --steps 16 --drain-steps 112 \
            --seeds 901 1701 \
            --start-month ${{ matrix.scenario.month }} \
            --start-day ${{ matrix.scenario.day }} \
            --cpu-capacity-scale ${{ matrix.scenario.scale }} \
            --policies queue_nsga2_with_transit queue_nsga2_front_carbon_risk queue_nsga2_front_carbon_taskwise \
            --output-prefix "research/results/taskwise_${{ matrix.scenario.name }}" \
            2>&1 | tee "research/results/taskwise_${{ matrix.scenario.name }}.log"
      - name: Audit lifecycle, matched tasks, fixed budget, and actual outcomes
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          from research.paired_task_analysis import compare_task_rows
          stem="research/results/taskwise_${{ matrix.scenario.name }}"
          rows=json.loads(Path(stem+".json").read_text())
          assert len(rows)==6
          for seed in (901,1701):
              group=[r for r in rows if r["seed"]==seed]
              assert len(group)==3
              assert len({r["tasks_dispatched"] for r in group})==1
              assert all(r["fully_drained"] and r["lifecycle_conserved"] and
                         r["fallback_assignments"]==0 and
                         r["tasks_finished"]==r["tasks_dispatched"] and
                         r["forecast_count"]==r["tasks_finished"] for r in group)
              base=next(r for r in group if r["policy"]=="queue_nsga2_with_transit")
              for r in group:
                  assert r["nsga2_evaluation_requests"]==base["nsga2_evaluation_requests"]
                  if r["policy"]!="queue_nsga2_with_transit":
                      assert r["front_carbon_selection_checks"]==r["nsga2_batch_optimizations"]
                  print("SEED",seed,r["policy"],
                        "SLA",r["sla_violated"],
                        "carbon",r["reported_total_carbon_kg"],
                        "cost",r["reported_total_cost_usd"],
                        "front-swaps",r["front_carbon_selection_changes"],
                        "mean-planner-ms",r["planner_dispatch_mean_ms"])
          with open(stem+"_completed_tasks.csv",newline="") as f:
              records=list(csv.DictReader(f))
          report=compare_task_rows(records,reference="queue_nsga2_with_transit")
          assert len(report)==4
          for p in report:
              print("paired:",json.dumps(p,sort_keys=True))
          Path(stem+"_paired.json").write_text(json.dumps(report,indent=2)+"\n")
          PY
      - name: Preserve full outcomes and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskwise-carbon-${{ matrix.scenario.name }}
          path: research/results/taskwise_*
          retention-days: 90
          if-no-files-found: warn
